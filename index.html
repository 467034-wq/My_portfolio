<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio - ภูมิสกุล สิทธิชัย</title>
<style>
  :root { --bg:#f05000; --ink:#fff; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif; color:var(--ink); }
  main { max-width:820px; margin:0 auto; padding:24px 12px 64px; }
  .page { display:block; width:100%; height:auto; margin:0 0 24px; border-radius:6px; background:#fff; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  footer { text-align:center; padding:8px 0 32px; font-size:14px; }
  @media (prefers-color-scheme: dark) { body { background:#c24000; } }
</style>
</head>
<body>
<main id="pages"></main>
<footer>Portfolio · ภูมิสกุล สิทธิชัย</footer>
<script>
  var box = document.getElementById("pages");
  for (var i = 1; i <= 11; i++) {
    var n = (i < 10 ? "0" : "") + i;
    var img = document.createElement("img");
    img.className = "page";
    img.src = "page-" + n + ".png";
    img.alt = "Portfolio หน้า " + i;
    img.loading = i > 2 ? "lazy" : "eager";
    img.onerror = function () { this.remove(); }; // ข้ามหน้าที่ยังไม่ได้อัปโหลด
    box.appendChild(img);
  }
</script>
</body>
</html>


</body>
</html>
